name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-core-and-docs:
    name: Core Unit Tests & Docs Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ libeigen3-dev libgtest-dev

      - name: Build & run all non-ROS scan_localizer gtest suites
        working-directory: src/scan_localizer
        run: |
          set -e
          mkdir -p /tmp/sloc_ci/obj
          INC="-Iinclude -I/usr/include/eigen3"
          FLAGS="-std=c++20 -O2 -Wall -Wextra -Wpedantic"
          CORE_SRCS=$(python3 -c '
          import re
          txt = open("CMakeLists.txt", encoding="utf-8").read()
          m = re.search(r"add_library\(scan_localizer_core\s+STATIC(.*?)\)", txt, re.S)
          assert m, "scan_localizer_core not found in CMakeLists.txt"
          print(" ".join(re.findall(r"src/[A-Za-z0-9_]+\.cpp", m.group(1))))
          ')
          echo "Discovered scan_localizer_core sources: $CORE_SRCS"
          for f in $CORE_SRCS src/sim_world.cpp; do
            base=$(basename "$f" .cpp)
            g++ $FLAGS $INC -c "$f" -o "/tmp/sloc_ci/obj/$base.o"
          done
          for tf in test/test_*.cpp; do
            base=$(basename "$tf" .cpp)
            if [ "$base" = "test_localizer_node" ]; then
              continue
            fi
            echo "=== Running $base ==="
            g++ $FLAGS $INC /tmp/sloc_ci/obj/*.o "$tf" \
              -lgtest -lgtest_main -lpthread -o "/tmp/sloc_ci/$base"
            "/tmp/sloc_ci/$base" --gtest_brief=1
          done

      - name: Verify tutorial code manifest, param parity & doc links
        run: |
          python3 docs/scan_localizer_tutorial/tests/sync_code_manifest.py --check-params
          python3 docs/scan_localizer_tutorial/tests/check_code_refs.py
          python3 docs/tools/check_tutorial_links.py

  core-asan-ubsan:
    name: Core Unit Tests (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ libeigen3-dev libgtest-dev

      - name: Build & run all non-ROS scan_localizer tests under ASan + UBSan
        working-directory: src/scan_localizer
        run: |
          set -e
          mkdir -p /tmp/sloc_asan/obj
          INC="-Iinclude -I/usr/include/eigen3"
          FLAGS="-std=c++20 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -Wall -Wextra -Wpedantic"
          CORE_SRCS=$(python3 -c '
          import re
          txt = open("CMakeLists.txt", encoding="utf-8").read()
          m = re.search(r"add_library\(scan_localizer_core\s+STATIC(.*?)\)", txt, re.S)
          assert m, "scan_localizer_core not found in CMakeLists.txt"
          print(" ".join(re.findall(r"src/[A-Za-z0-9_]+\.cpp", m.group(1))))
          ')
          for f in $CORE_SRCS src/sim_world.cpp; do
            base=$(basename "$f" .cpp)
            g++ $FLAGS $INC -c "$f" -o "/tmp/sloc_asan/obj/$base.o"
          done
          for tf in test/test_*.cpp; do
            base=$(basename "$tf" .cpp)
            if [ "$base" = "test_localizer_node" ]; then
              continue
            fi
            echo "=== ASan/UBSan $base ==="
            g++ $FLAGS $INC /tmp/sloc_asan/obj/*.o "$tf" \
              -lgtest -lgtest_main -lpthread -o "/tmp/sloc_asan/$base"
            ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
              "/tmp/sloc_asan/$base" --gtest_brief=1
          done

  aarch64-cross-compile:
    name: ARM64 (RK3399 NEON) Cross-Compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install aarch64 toolchain, QEMU & Eigen3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu qemu-user-static libeigen3-dev

      - name: Cross-compile scan_localizer_core & run ARM64 NEON smoke test under QEMU
        working-directory: src/scan_localizer
        run: |
          set -e
          mkdir -p /tmp/sloc_arm64
          INC="-Iinclude -I/usr/include/eigen3"
          FLAGS="-std=c++20 -O2 -Wall -Wextra -Wpedantic"
          CORE_SRCS=$(python3 -c '
          import re
          txt = open("CMakeLists.txt", encoding="utf-8").read()
          m = re.search(r"add_library\(scan_localizer_core\s+STATIC(.*?)\)", txt, re.S)
          assert m, "scan_localizer_core not found in CMakeLists.txt"
          print(" ".join(re.findall(r"src/[A-Za-z0-9_]+\.cpp", m.group(1))))
          ')
          echo "Cross-compiling ARM64 sources: $CORE_SRCS"
          for f in $CORE_SRCS src/sim_world.cpp; do
            base=$(basename "$f" .cpp)
            aarch64-linux-gnu-g++ $FLAGS $INC -c "$f" -o "/tmp/sloc_arm64/$base.o"
          done
          cat << 'NEON_EOF' > /tmp/sloc_arm64/neon_smoke.cpp
          #include <cmath>
          #include <iostream>
          #include <random>
          #include "scan_localizer/map_field.hpp"
          #include "scan_localizer/matchers.hpp"
          #include "scan_localizer/sim_world.hpp"

          int main() {
            const auto grid = sloc::sim::make_warehouse(0.05);
            sloc::MapField field;
            if (!field.build(grid, 0.20) || field.likeDataU8() == nullptr) {
              std::cerr << "MapField build failed\n";
              return 1;
            }
            std::mt19937 rng(99);
            sloc::sim::ScanSimConfig scfg;
            scfg.beams = 360;
            scfg.noise_std = 0.01;
            const sloc::Pose2 gt(6.0, 5.0, 0.7);
            const auto scan = sloc::sim::make_scan(grid, gt, scfg, rng);
            const double ang_step = sloc::compute_adaptive_ang_step(field, scan);
            const auto res = sloc::global_correlative(field, scan, 3, ang_step, 8, 2500.0);
            const double pos_err = std::hypot(res.pose.x - gt.x, res.pose.y - gt.y);
            const double ang_err = std::abs(sloc::wrap_angle(res.pose.theta - gt.theta));
            std::cout << "ARM64 NEON global_correlative: valid=" << res.valid
                      << " pos_err=" << pos_err << "m ang_err=" << ang_err << "rad\n";
            if (!res.valid || pos_err >= 0.30 || ang_err >= 0.20) {
              return 2;
            }
            return 0;
          }
          NEON_EOF
          aarch64-linux-gnu-g++ $FLAGS $INC -static /tmp/sloc_arm64/*.o \
            /tmp/sloc_arm64/neon_smoke.cpp -lpthread -o /tmp/sloc_arm64/neon_smoke
          qemu-aarch64-static /tmp/sloc_arm64/neon_smoke

  ros2-jazzy-scan-localizer:
    name: ROS 2 Jazzy Build, Test & Lint
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ROS 2 dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            libeigen3-dev \
            python3-colcon-common-extensions \
            ros-jazzy-rclcpp-lifecycle \
            ros-jazzy-rclcpp-components \
            ros-jazzy-sensor-msgs \
            ros-jazzy-nav-msgs \
            ros-jazzy-geometry-msgs \
            ros-jazzy-diagnostic-msgs \
            ros-jazzy-lifecycle-msgs \
            ros-jazzy-std-srvs \
            ros-jazzy-tf2-ros \
            ros-jazzy-ament-cmake-gtest \
            ros-jazzy-ament-lint-auto \
            ros-jazzy-ament-lint-common

      - name: Colcon build & test (scan_localizer)
        shell: bash
        run: |
          set -e
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select scan_localizer \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
          colcon test --packages-select scan_localizer \
            --event-handlers console_cohesion+
          colcon test-result --all --verbose
