<body>

  <header class="page-header">

      <div class="crumb"><a href="../index.html">概览</a> / 第五阶段 · 速查与手册 / 第 10 章</div>
      <h1>C++20 × Eigen × ROS 2 语法与工程技巧实战手册</h1>
      <p class="sub">横跨 <code>scan_localizer</code> 全仓库的高频现代 C++20 语法、Eigen 数值稳定技巧、零堆分配优化与 ROS 2 Jazzy 工程铁律。支持按领域标签实时筛选。</p>
    </div>

  <main class="container" style="padding: 36px 24px 80px;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px;">
      <div class="segmented" id="ch10-tags">
        <button type="button" class="active" data-tag="all">全部卡片</button>
        <button type="button" data-tag="cpp20">C++20 特性</button>
        <button type="button" data-tag="eigen">Eigen 数值代数</button>
        <button type="button" data-tag="perf">零分配与并发</button>
        <button type="button" data-tag="ros2">ROS 2 Jazzy</button>
      </div>
      <input id="ch10-search" type="search" placeholder="筛选关键字（如 LDLT, Joseph, Lifecycle, if constexpr）..."
        style="width:320px;max-width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--hairline-strong);background:var(--bg-card);color:var(--ink);font-size:14px;outline:none;" />
    </div>

    <div class="bento-2" id="ch10-cards"></div>

    <nav class="pager" style="max-width:780px;">
      <a href="ch09.html"><div class="dir">← 上一章</div><div class="ttl">第 9 章 · E1–E10 与真值三方评测</div></a>
      <a class="next" href="../code-index.html"><div class="dir">全景导航 →</div><div class="ttl">浏览 33 个源码文件地图</div></a>
    </nav>
  </main>

  <footer class="site-footer">scan_localizer Engineering Tutorial · Chapter 10</footer>

  <script>
    window.addEventListener("sloc:ready", function () {
      const CARDS = [
        { tag: "cpp20", title: "O(1) 硬件级角度归一化 + NaN 免疫", file: "include/scan_localizer/se2.hpp", lines: "34-46",
          bad: "while (a > M_PI) a -= 2*M_PI; // 遇 inf/NaN 直接死循环卡死线程",
          good: "if (!std::isfinite(a)) return 0.0;\ndouble r = std::remainder(a, kTwoPi);",
          why: "C++20 std::numbers::pi + std::remainder 一次指令搞定任意数量级大角。" },
        { tag: "cpp20", title: "C++20 Concept + if constexpr 编译期特化", file: "include/scan_localizer/se2.hpp", lines: "80-93",
          bad: "out.reserve(scan.size()); // 若传入前向迭代器，distance 是 O(N) 白算两次",
          good: "if constexpr (std::random_access_iterator<It>) {\n  out.reserve(std::distance(begin, end));\n}",
          why: "只对随机访问迭代器 O(1) 预分配容量，其它迭代器在编译期裁掉该分支。" },
        { tag: "cpp20", title: "std::filesystem::path 跨平台相对路径拼接", file: "src/map_io.cpp", lines: "288-295",
          bad: "std::string img = yaml_dir + \"/\" + image; // 裸文件名无目录时误拼出 \"/map.pgm\"",
          good: "if (img_fs.is_relative() && !yaml_fs.parent_path().empty())\n  img_fs = yaml_fs.parent_path() / img_fs;",
          why: "杜绝当前目录传裸文件名 load_map_yaml(\"floor.yaml\") 去根目录找图片。" },
        { tag: "eigen", title: "eval() 消除 Eigen 表达式混淆 (Aliasing)", file: "src/matchers.cpp", lines: "93-93",
          bad: "cov = 0.5 * (cov + cov.transpose()); // 未必立即求值时就地读写会算错对称块",
          good: "cov = 0.5 * (cov + cov.transpose()).eval();",
          why: "矩阵自身参与转置求和赋回自身时，.eval() 显式落盘临时矩阵消除混淆。" },
        { tag: "eigen", title: "LDLT vs SelfAdjointEigenSolver 分工", file: "src/localizer_core.cpp", lines: "615-660",
          bad: "S.inverse(); // 对退化/近奇异 3×3 矩阵直接 inverse() 无法感知数值病态",
          good: "Eigen::LDLT<Cov3> ldlt(S);\nif (ldlt.info() == Eigen::Success && ldlt.isPositive())\n  x = ldlt.solve(innov);",
          why: "线性求解用 LDLT 既快又能验正定性；协方差门控才用 SelfAdjointEigenSolver 查真实特征值。" },
        { tag: "eigen", title: "Joseph 形式保证 4×4 EKF 协方差永不失正定", file: "src/localizer_core.cpp", lines: "682-686",
          bad: "P4_ = (I - K4 * H) * P4_pred; // 高条件数矩阵做减法极易得出负对角元",
          good: "const Matrix4d I_KH = Matrix4d::Identity() - K4 * H;\nP4_ = I_KH * P4_pred * I_KH.transpose() + K4 * R * K4.transpose();",
          why: "两项各自天然对称半正定，相加在任何条件数下保持稳定正定。" },
        { tag: "perf", title: "热循环零分配缓冲复用模式", file: "include/scan_localizer/particle_filter.hpp", lines: "75-78",
          bad: "std::vector<Vec2> sub; // 每帧 40Hz 在 update() 内频繁 malloc/free",
          good: "sub_pts_.clear(); // 类成员复用同一块已扩好容量的堆内存",
          why: "嵌入式 ARM (RK3588) 上可大幅压低内存碎片与延迟抖动 P99。" },
        { tag: "perf", title: "锁外构场 + 原子交换 + 锁外快照发布", file: "src/localizer_node.cpp", lines: "909-953",
          bad: "std::lock_guard<std::mutex> lk(state_mtx_); field->build(...); pub->publish(...);",
          good: "auto field = std::make_shared<MapField>(); field->build(...);\n{ std::lock_guard lk(state_mtx_); field_ = field; }\npublishOutputs(snap, stamp);",
          why: "绝不持锁做耗时建场或 DDS I/O，确保高频激光/IMU 回调零饥饿与零死锁。" },
        { tag: "ros2", title: "6×6 协方差下标铁律 kIdx = {0, 1, 5}", file: "src/localizer_node.cpp", lines: "1584-1590",
          bad: "pm.pose.covariance[2 * 6 + 2] = cov(2, 2); // 把航向方差塞进 z 轴了!",
          good: "constexpr int kIdx[3] = {0, 1, 5};\npm.pose.covariance[6 * kIdx[i] + kIdx[j]] = cov(i, j);",
          why: "ROS 消息顺序永远是 (x,y,z,r,p,yaw)，yaw 在索引 5 对应矩阵 [35]。" },
        { tag: "ros2", title: "SensorDataQoS + 双回调组 + Lifecycle 契约", file: "src/localizer_node.cpp", lines: "64-174",
          bad: "autostart 构造函数直接开跑，忽略 Nav2 lifecycle_manager 状态切换",
          good: "autostart: false;\ncreate_subscription(imu_topic_, rclcpp::SensorDataQoS(), ..., sensor_opt);",
          why: "BestEffort IMU 对齐、高频传感器与耗时服务线程彻底物理隔离。" },
      ];

      let curTag = "all";
      let curQ = "";

      function render() {
        const q = curQ.trim().toLowerCase();
        const items = CARDS.filter((c) => (curTag === "all" || c.tag === curTag) &&
          (!q || c.title.toLowerCase().includes(q) || c.bad.toLowerCase().includes(q) || c.good.toLowerCase().includes(q) || c.why.toLowerCase().includes(q)));
        const host = document.getElementById("ch10-cards");
        host.innerHTML = items.map((c) => `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;">
              <div>
                <span class="pill" style="color:var(--accent);margin-bottom:6px;">${c.tag.toUpperCase()}</span>
                <h3 style="margin:4px 0 0;font-size:18px;">${c.title}</h3>
              </div>
              <button type="button" class="src-jump" data-file="${c.file}" data-lines="${c.lines}" data-label="${c.title}">L${c.lines}</button>
            </div>
            <div class="code-card" style="margin:10px 0;">
              <div class="code-head"><span class="code-file" style="color:#ff6961;">❌ 常见陷阱</span></div>
              <pre style="padding:10px 14px;font-size:12px;"><code class="language-cpp">${c.bad.replace(/</g, "&lt;")}</code></pre>
            </div>
            <div class="code-card" style="margin:10px 0;">
              <div class="code-head"><span class="code-file" style="color:#30d158;">✅ 本项目最佳实践 (${c.file})</span></div>
              <pre style="padding:10px 14px;font-size:12px;"><code class="language-cpp">${c.good.replace(/</g, "&lt;")}</code></pre>
            </div>
            <p style="font-size:14px;color:var(--ink-2);margin:0;">${c.why}</p>
          </div>
        `).join("");
        if (window.hljs) host.querySelectorAll("pre code").forEach((el) => window.hljs.highlightElement(el));
      }

      document.querySelectorAll("#ch10-tags button").forEach((b) => {
        b.addEventListener("click", () => {
          document.querySelectorAll("#ch10-tags button").forEach((x) => x.classList.remove("active"));
          b.classList.add("active");
          curTag = b.dataset.tag;
          render();
        });
      });
      document.getElementById("ch10-search").addEventListener("input", (e) => { curQ = e.target.value; render(); });
      render();
    });
  </script>
</body>
</html>
