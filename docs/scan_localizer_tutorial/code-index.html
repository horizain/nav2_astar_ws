<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代码全景索引 · scan_localizer 全部 33 个源码文件地图</title>
  <link rel="stylesheet" href="../website/vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="css/apple.css" />
  <script>window.TUTORIAL_ROOT = "."; window.PAGE_ID = "code-index";</script>
  <script defer src="../website/vendor/katex/katex.min.js"></script>
  <script defer src="../website/vendor/katex/contrib/auto-render.min.js"></script>
  <script defer src="../../slam-mpc-academy/assets/vendor/hljs/highlight.min.js"></script>
  <script defer src="js/code-manifest.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="site-nav"></div>

  <header class="page-header">
    <div class="container">
      <div class="crumb"><a href="index.html">概览</a> / 代码全景索引</div>
      <h1>33 个文件，一张清楚的代码地图。</h1>
      <p class="sub">
        覆盖 <code>src/scan_localizer</code> 全部 11,904 行源码（头文件、核心实现、ROS 2 Lifecycle 节点、Launch/YAML 与 9 组测试）。
        点击任何文件或符号即可在侧栏源码抽屉高亮预览。
      </p>
      <div class="pill-row">
        <span class="pill">基线提交：98fcd28</span>
        <span class="pill">头文件 8 个</span>
        <span class="pill">实现文件 9 个</span>
        <span class="pill">测试与基准 10 个</span>
        <span class="pill">配置与构建 6 个</span>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 40px 24px 80px;">
    <!-- 3 Reading Routes -->
    <section style="margin-bottom: 42px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
        <div>
          <span class="eyebrow">Recommended Paths</span>
          <h2 style="margin:0;font-size:26px;">三条推荐阅读路线</h2>
        </div>
        <div class="segmented" id="route-tabs">
          <button type="button" class="active" data-route="fast">3 小时速通</button>
          <button type="button" data-route="algo">纯算法核精读</button>
          <button type="button" data-route="eng">全栈 ROS 2 工程</button>
        </div>
      </div>
      <div class="card" id="route-panel"></div>
    </section>

    <!-- Search & Group Filter -->
    <section>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:18px;">
        <div class="segmented" id="group-tabs">
          <button type="button" class="active" data-group="all">全部 (33)</button>
          <button type="button" data-group="geometry">几何与地图 (5)</button>
          <button type="button" data-group="matchers">匹配与 PF (4)</button>
          <button type="button" data-group="core">4D EKF 核心 (2)</button>
          <button type="button" data-group="ros">ROS 2 与配置 (8)</button>
          <button type="button" data-group="sim_test">仿真与测试 (14)</button>
        </div>
        <input id="index-filter" type="search" placeholder="过滤文件名或符号（如 FieldGn, EKF）..."
          style="width:320px;max-width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--hairline-strong);background:var(--bg-card);color:var(--ink);font-size:14px;outline:none;" />
      </div>

      <div id="manifest-list" style="display:grid;gap:14px;"></div>
    </section>
  </main>

  <footer class="site-footer">
    scan_localizer Code Atlas · 全部 33 个文件与行号经过自动一致性验证
  </footer>

  <script>
    window.addEventListener("sloc:ready", function () {
      const M = window.SLOC_MANIFEST;
      let curRoute = "fast";
      let curGroup = "all";
      let curQuery = "";

      function renderRoute() {
        const r = M.ROUTES[curRoute];
        const panel = document.getElementById("route-panel");
        panel.innerHTML = `
          <div style="margin-bottom:14px;">
            <div style="font-size:18px;font-weight:700;">${r.name}</div>
            <div style="font-size:14px;color:var(--ink-3);margin-top:2px;">${r.desc}</div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;">
            ${r.steps.map((s, idx) => {
              const action = s.ch
                ? `href="chapters/${s.ch}.html"`
                : `href="#" data-file="${s.file}" data-lines="1-80" data-label="${s.title}"`;
              return `<a class="card card-hover" style="padding:14px 16px;" ${action}>
                <div style="font-family:var(--font-mono);font-size:11px;color:var(--accent);font-weight:700;">STEP 0${idx + 1}</div>
                <div style="font-size:14.5px;font-weight:600;color:var(--ink);margin:4px 0;">${s.title}</div>
                <div style="font-size:12.5px;color:var(--ink-3);line-height:1.4;">${s.note}</div>
              </a>`;
            }).join("")}
          </div>
        `;
      }

      function renderFiles() {
        const q = curQuery.trim().toLowerCase();
        const items = M.FILES.filter((f) => {
          if (curGroup !== "all" && f.group !== curGroup) return false;
          if (!q) return true;
          return f.path.toLowerCase().includes(q) ||
            f.role.toLowerCase().includes(q) ||
            f.symbols.some((s) => s.name.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q));
        });
        const host = document.getElementById("manifest-list");
        host.innerHTML = items.map((f) => `
          <div class="card" style="padding:18px 22px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
              <div>
                <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                  <span style="font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--ink);">${f.path}</span>
                  <span class="pill">${f.lines} 行</span>
                  <a class="pill" style="color:var(--accent);" href="chapters/${f.chapter}.html">精讲：${f.chapter.toUpperCase()} →</a>
                </div>
                <div style="font-size:14px;color:var(--ink-2);margin-top:6px;">${f.role}</div>
              </div>
              <button type="button" class="btn btn-secondary btn-sm" data-file="${f.path}" data-lines="1-${Math.min(120, f.lines)}" data-label="${f.path}">打开源码抽屉</button>
            </div>
            <div class="src-bar" style="margin:12px 0 0;">
              ${f.symbols.map((s) => `
                <button type="button" class="src-jump" data-file="${f.path}" data-lines="${s.range}" data-label="${s.name} — ${s.desc}">
                  <span class="tag">${s.name}</span>
                  <span>L${s.range}</span>
                </button>
              `).join("")}
            </div>
          </div>
        `).join("");
      }

      document.querySelectorAll("#route-tabs button").forEach((b) => {
        b.addEventListener("click", () => {
          document.querySelectorAll("#route-tabs button").forEach((x) => x.classList.remove("active"));
          b.classList.add("active");
          curRoute = b.dataset.route;
          renderRoute();
        });
      });
      document.querySelectorAll("#group-tabs button").forEach((b) => {
        b.addEventListener("click", () => {
          document.querySelectorAll("#group-tabs button").forEach((x) => x.classList.remove("active"));
          b.classList.add("active");
          curGroup = b.dataset.group;
          renderFiles();
        });
      });
      document.getElementById("index-filter").addEventListener("input", (e) => {
        curQuery = e.target.value;
        renderFiles();
      });

      renderRoute();
      renderFiles();
    });
  </script>
</body>
</html>
