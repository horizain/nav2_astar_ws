# scan_localizer 生产参数（RK3399/3588 实测预算：~10% 单核 @10Hz）
# 全量参数与 LocalizerNode 声明一一对应；默认 autostart: false 适配 Nav2 lifecycle_manager
/**:
  ros__parameters:
    # --- 生命周期 ---
    autostart: false                  # 生产由 Nav2 lifecycle_manager 驱动；演示/单机可在 launch 覆写 true

    # --- 话题与服务名（相对名，自动适配命名空间隔离） ---
    map_topic: "map"
    scan_topic: "scan"
    odom_topic: "odom"
    imu_topic: "imu"                  # SensorDataQoS（best-effort）
    initialpose_topic: "initialpose"
    pose_topic: "localizer/pose"
    status_topic: "localizer/status"
    hypotheses_topic: "localizer/hypotheses"
    global_hypotheses_topic: "localizer/global_hypotheses"
    map_path_topic: "localizer/map_path"
    global_relocalize_service: "localizer/global_relocalize"
    set_fine_mode_service: "localizer/set_fine_mode"
    nomotion_update_service: "localizer/nomotion_update"

    # --- 坐标系 ---
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"

    # --- 地图管理（可选业务直载与热切换） ---
    map_yaml: ""                      # 非空时在 on_configure 直接加载 YAML 地图（免 map_server）
    map_keep_pose: true               # 切图后保留当前位姿（false 则触发全局重定位）

    # --- 匹配器选择（实验结论：跟踪用 composed；详见 README 决策表） ---
    # 可选: composed / correlative / field_gn / icp_p2p / ndt
    matcher: "composed"
    likelihood_sigma: 0.20            # 似然场平滑尺度 (m)
    ndt_voxel: 0.5                    # 仅 matcher=ndt 时生效 (m)

    # --- 扫描预处理与外参回退 ---
    scan_subsample: 2                 # 每 N 束取 1（嵌入式降 CPU；精度损失 <1mm）
    min_scan_points: 10               # 有效激光点数下限（低于此值丢帧并节流告警）
    range_max_override: 0.0           # >0 时覆盖 LaserScan.range_max (m)
    laser_x: 0.0                      # 无 TF 外参时的 2D 回退安装偏移 x (m)
    laser_y: 0.0                      # 无 TF 外参时的 2D 回退安装偏移 y (m)
    laser_theta: 0.0                  # 无 TF 外参时的 2D 回退安装偏航角 (rad)

    # --- 跟踪窗口（odom 一周期滑移预算；轮子打滑严重时放宽） ---
    match_window_lin: 0.15            # ± m
    match_window_ang: 0.10            # ± rad
    match_step_lin: 0.03              # 粗搜步长 (m)
    match_step_ang: 0.02              # 粗搜角步长 (rad)
    huber_delta: 0.10                 # 鲁棒核转折 (m)
    trim_dist: 0.50                   # 残差截断（动态物体抑制, 3σ 原则）

    # --- 门限（安全核心：拒绝永远比接受坏匹配便宜） ---
    min_inlier_ratio: 0.60
    min_score: 0.35
    mahal_gate: 9.0                   # χ²(3) 3σ
    max_cov_eig: 1.0                  # 匹配协方差最小特征值上限 (m²)

    # --- 状态机 ---
    degraded_after: 5                 # 连续拒绝 N 帧 → DEGRADED
    lost_after: 60                    # DEGRADED 累计拒绝 N 帧 → LOST（触发全局重定位）

    # --- 里程计与 IMU 融合 ---
    use_imu: false                    # true 时用陀螺航向增量替代轮式 Δθ
    odom_trans_var_per_m: 4.0e-4      # 轮式平移方差系数 (m²/m)
    odom_rot_var_per_rad: 1.0e-3      # 轮式旋转方差系数 (rad²/rad)
    odom_rot_var_per_m: 2.0e-3        # 轮式行驶引发航向漂移系数 (rad²/m)
    imu_rot_var_per_rad: 2.0e-5       # 陀螺旋转方差系数 (rad²/rad)
    max_imu_dt: 0.5                   # IMU 相邻帧最大允许时间间隔 (s)，超界或 <=0 丢弃
    odom_timeout: 1.0                 # /odom 超时判定阈值 (s)

    # --- 全局重定位（冷启动 / 绑架恢复） ---
    use_global_search: true
    global_async: true                # 异步隔离线程跑 B&B，不阻塞 TRACKING 回调
    global_max_time_ms: 250.0         # 全局搜索墙钟熔断预算 (ms)
    global_worker_nice: 10            # 后台线程 nice 降权值
    global_retry_cooldown_s: 1.5      # 原地静止失锁时的全局搜索重试冷却 (s)
    global_retry_move_m: 0.15         # 位移超过此阈值立即解除冷却重试 (m)

    # --- 预测协方差下限、高置信度 kMahal 软门控与里程计跳变防护（P0） ---
    min_pred_trans_var: 2.25e-4       # 预测平移方差下限 (0.015 m)²
    min_pred_rot_var: 2.25e-4         # 预测航向方差下限 (0.015 rad)²
    mahal_soft_min_score: 0.85        # 高置信度软放行最低得分
    mahal_soft_min_inlier: 0.80       # 高置信度软放行最低内点率
    mahal_soft_max_cond: 25.0         # 2x2 平移协方差非退化条件数上限
    odom_jump_max_trans: 0.30         # 单周期里程计位移突变阈值 (m)
    odom_jump_max_rot: 0.45           # 单周期里程计转角突变阈值 (rad)

    # --- 现场黑匣子记录（默认关闭） ---
    blackbox_enabled: false
    blackbox_output_dir: "/tmp/scan_localizer_blackbox"

    # --- TF 发布与查询 ---
    tf_broadcast: true                # 是否广播 map -> odom TF
    transform_tolerance: 0.1          # TF 未来时间戳裕度 (s)
    tf_publish_rate: 10.0             # TF 保活定时发布频率 (Hz，0 表示关闭保活)
    tf_lookup_timeout: 0.05           # TF2 查询等待超时 (s)
